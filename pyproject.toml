[project]
name = "vaas"
requires-python = ">=3.10"
dynamic = ["version"]
description = "VAAS (Vision-Attention Anomaly Scoring) is a dual-module vision framework for image anomaly detection and localisation."
readme = "pypiREADME.md"
license-files = ["LICENSE"]
authors = [
    { name = "Opeyemi Bamigbade" },
    { name = "Mark Scanlon" },
    { name = "John Sheppard" },
]

keywords = [
    "anomaly detection",
    "computer vision",
    "vision transformers",
    "deep learning",
    "image forensics",
    "representation learning",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
  "transformers>=4.40",
  "numpy",
  "pillow",
  "tqdm",
  "scipy",
  "opencv-python-headless",
  "matplotlib>=3.10.8",
]

[dependency-groups]
default = []

torch = [
  "torch>=2.2",
  "torchvision>=0.17",
]

cuda-dev = [
  "torch==2.10.0.dev20251203+cu128",
  "torchvision==0.25.0.dev20251203+cu128",
]

dev = [
  "pre-commit>=4.5.0",
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.setuptools.packages.find]
include = ["vaas*"]
exclude = ["tests*"]

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/nightly/cu128"]
index-strategy = "unsafe-best-match"

[tool.setuptools.dynamic]
version = {attr = "vaas._version.__version__"}


[tool.ruff]
exclude = [
    "examples/notebooks/",
]
line-length = 88
target-version = "py310"

lint.select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # import sorting
  "B",  # bugbear
  "UP", # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.urls]
Homepage = "https://github.com/OBA-Research/VAAS"
Repository = "https://github.com/OBA-Research/VAAS"
Documentation = "https://github.com/OBA-Research/VAAS#readme"
Issues = "https://github.com/OBA-Research/VAAS/issues"
HuggingFace = "https://huggingface.co/OBA-Research/vaas"
